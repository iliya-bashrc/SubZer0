  <text x="207" y="245" fill="#c4cdd1" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" letter-spacing="0.1">CVE intelligence · vulnerability research</text>
  <path d="M208 276h350" stroke="#27343a" stroke-width="1"/>
  <text x="208" y="311" fill="#9aa8ae" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="0.45">NVD  ·  GITHUB SECURITY ADVISORIES  ·  CISA KEV</text>

  <path d="M738 82v254" stroke="#35434a" stroke-width="1"/>
  <path d="M738 82v42" stroke="#69bddb" stroke-width="2"/>
  <text x="785" y="111" fill="#9aa8ae" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2.7">MAINTAINERS</text>
  <circle cx="792" cy="164" r="3.2" fill="#69bddb"/>
  <text x="810" y="172" fill="#edf2f3" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="550" letter-spacing="0.1">@RootAccessClub</text>
  <circle cx="792" cy="222" r="3.2" fill="#69bddb"/>
  <text x="810" y="230" fill="#edf2f3" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="550" letter-spacing="0.1">@BugCod3</text>
  <text x="785" y="300" fill="#9aa8ae" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="1.5">CAPTURED DATA · NOT A LIVE FEED</text>

  <g transform="translate(1040 338)">
    <rect x="0" y="0" width="7" height="7" rx="1" fill="#ef4444"/>
