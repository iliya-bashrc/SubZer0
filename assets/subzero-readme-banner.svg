<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SubZer0 — CVE intelligence and vulnerability research</title>
  <desc id="desc">A cold-cyan geometric SubZer0 mark on a deep graphite field, with the maintainers @RootAccessClub and @BugCod3 and a note that the bundled data is a static snapshot.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a1e"/>
      <stop offset="0.52" stop-color="#0b1013"/>
      <stop offset="1" stop-color="#11191d"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7edf8"/>
      <stop offset="1" stop-color="#69bddb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="14" fill="#080c0f"/>
  <rect x="1" y="1" width="1198" height="418" rx="13" fill="url(#surface)" stroke="#34434a" stroke-width="2"/>
  <path d="M32 42H1168M32 378H1168" stroke="#29363c" stroke-width="1"/>
  <path d="M32 42h112" stroke="#69bddb" stroke-width="2"/>

  <g fill="none" stroke="url(#mark)" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M112 91 170 149 112 207 54 149 112 91Z" stroke-width="2.4"/>
