name: Site and feed checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Unit and static-site tests
        run: python -m unittest discover -s tests -v
      - name: Check browser script syntax
        run: node --check app.js

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Expose the installed Chromium executable to the test harness
        run: |
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; manager=sync_playwright(); p=manager.start(); print(p.chromium.executable_path); p.stop()')"
          echo "SUBZERO_CHROMIUM=$CHROMIUM_PATH" >> "$GITHUB_ENV"
      - name: Run real-browser regression tests
        run: python -m unittest discover -s tests -p 'test_browser_regression.py' -v
