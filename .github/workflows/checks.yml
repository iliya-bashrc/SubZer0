name: Site and feed checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit and static-site tests
        run: python -m unittest discover -s tests -v
      - name: Check browser script syntax
        run: node --check app.js
