name: Telegram digest (daily + weekly)

# Daily ~10:00 Iran time: short "patch now" post (skipped on quiet days). Saturday: weekly summary card.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = weekly on Saturday, daily otherwise"
        type: choice
        options: [auto, daily, weekly]
        default: auto
      theme:
        description: "Banner theme (auto rotates; all = one card per theme, for review)"
        type: choice
        options: [auto, all, spotlight, bignumber, terminal, radar, heatmap, frost]
        default: auto
      send_to:
        description: "Optional chat id to send to instead of the channel (e.g. your own id for a private preview)"
        type: string
        default: ""
      dry_run:
        description: "Only print the post in the log"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: subzero-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate the committed snapshot
        run: python3 scripts/verify_data_snapshot.py --root public/snapshot

      - name: Build and post the digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          THEME: ${{ inputs.theme || 'auto' }}
          SEND_TO: ${{ inputs.send_to || '' }}
        run: |
          case "$MODE" in auto|daily|weekly) ;; *) echo "bad mode"; exit 1;; esac
          case "$THEME" in auto|all|spotlight|bignumber|terminal|radar|heatmap|frost) ;; *) echo "bad theme"; exit 1;; esac
          case "$SEND_TO" in ""|@*|-[0-9]*|[0-9]*) ;; *) echo "bad send_to"; exit 1;; esac
          ARGS=(--mode "$MODE")
          [ "$THEME" != auto ] && ARGS+=(--theme "$THEME")
          [ -n "$SEND_TO" ] && ARGS+=(--chat "$SEND_TO")
          [ -n "$DRY_RUN" ] && ARGS+=(--dry-run)
          python3 scripts/digest.py "${ARGS[@]}"
