name: apply-drafts-patch
on:
  push:
    branches: [owner-drafts]
    paths: ['.github/patches/drafts.patch']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: owner-drafts
      - run: |
          git apply .github/patches/drafts.patch
          cat > /tmp/sums <<'S'
          afb640d2fc227a9f5d23f1d019d129cdab06d1d51042b2682cce98dee71d12d5  README.md
          df1e1ba246740d38054b27a894c3228f058f36fb679fb6a41eaa8325b069d8e8  scripts/deploy_bot.py
          a6e0a84f36ece2ca6e0d6269af8e3e8e257395dd0d71319d0c8611710687db8d  scripts/digest.py
          01a9ec4dd86e1ed08c91ec1864cac4fbff175b2f60442aa8f6cb4bf9616b9aa4  scripts/drafts.py
          b0627bd6203ca87e1183525d745bd9144d53f99a9e2b2554c27ae708b96f5800  scripts/early_warning.py
          f156d2f65cef769660f9daf4998b4d3825147025b6e90d86c020609e4c70e6cd  scripts/notify_telegram.py
          53c6a01c8c73c72b29d9cbdf9974e4d9703cb3bceab07b6a27e511775f7f9a4a  tests/bot_harness.mjs
          7562c286a84117a560b68645da4c6931b2e0a6d0b8a6098bed3305b636ae1ab5  tests/test_bot.py
          1d10942f2051de1460355ae39040ced6ac8c6b999d49670767da697bf2f3ead8  worker/bot.js
          S
          sed -i 's/^ *//' /tmp/sums
          sha256sum -c /tmp/sums
          node --check worker/bot.js
          git rm -q .github/patches/drafts.patch
          git config user.name "iliya-bashrc"
          git config user.email "iliya-bashrc@users.noreply.github.com"
          git add -A worker scripts tests README.md
          git commit -m "Channel posts need the owner's OK: drafts with Post/Skip, daily brief to groups only"
          git push origin HEAD:owner-drafts
