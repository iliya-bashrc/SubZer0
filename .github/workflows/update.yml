name: Refresh vulnerability feed

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vulnerability-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the Pages source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run feed pipeline tests
        run: python -m unittest discover -s tests -v

      - name: Collect and validate the complete 30-day feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/update_data.py

      - name: Publish changed snapshot to the Pages source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CVE feed $(date -u +%FT%TZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Feed snapshot unchanged; no commit required."
          fi
