name: Refresh vulnerability feed

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vulnerability-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the Pages source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Run feed pipeline tests
        run: python -m unittest discover -s tests -v

      - name: Collect and validate the complete 30-day feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/update_data.py

      - name: Verify every committed feed shard and sidecar
        run: python scripts/verify_data_snapshot.py

      - name: Check browser script syntax
        run: |
          node --check app.js
          node --check community.js

      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Expose the installed Chromium executable to the test harness
        run: |
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; manager=sync_playwright(); p=manager.start(); print(p.chromium.executable_path); p.stop()')"
          echo "SUBZERO_CHROMIUM=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      - name: Run real-browser regression tests before publishing
        run: python -m unittest discover -s tests -p 'test_browser_regression.py' -v

      - name: Publish changed snapshot to the Pages source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data api/v1/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CVE feed $(date -u +%FT%TZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Feed snapshot unchanged; no commit required."
          fi

      - name: Verify GitHub Pages serves the committed snapshot
        run: python scripts/verify_pages.py --manifest data/manifest.json --timeout-seconds 900 --interval-seconds 15
