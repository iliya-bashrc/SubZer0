name: apply-groups-patch
on:
  push:
    branches: [bot-groups]
    paths: ['.github/patches/groups.patch']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: bot-groups
      - run: |
          git apply .github/patches/groups.patch
          cat > /tmp/sums <<'S'
          70e0fc7b13f70b3e36dec154ea7b4dc8271f7bc5c90d3ea41479ac6a501ea2d3  worker/bot.js
          4aed1c95fc29170df124fbc79d170c9c954f8d01fda1408d9c87b983ca12fa32  scripts/deploy_bot.py
          cafefa9c6219b0e6cb4e4e6c0a9a05303e2f6484cc758c19035d5924b7524522  scripts/digest.py
          6c5e7bceb43fc519d2a259cc413dd7dde6163972fa0fe0b3ba87aa96c07207d3  scripts/notify_telegram.py
          849c1ad9c6a80430bc8600b10ac722ed1221bbab63cf0119841355aae4602e06  tests/bot_harness.mjs
          fe34948b5215eef7dbe6198198b1b6d6b743f0f9af20cdb8cf71f271915a0b57  tests/test_bot.py
          52e47e4258a742103129d74e77695b025238428e6225cad891c4272277ee8a26  tests/test_digest.py
          3330d5c1ea1672c2df61c2b8faffabedfb83285cb1b08e8460094af7bc6645c1  README.md
          S
          sed -i 's/^ *//' /tmp/sums
          sha256sum -c /tmp/sums
          node --check worker/bot.js
          git rm -q .github/patches/groups.patch
          git config user.name "iliya-bashrc"
          git config user.email "iliya-bashrc@users.noreply.github.com"
          git add -A worker scripts tests README.md
          git commit -m "Bot in groups: morning brief, admin-managed group watchlist, welcome on add"
          git push origin HEAD:bot-groups
