name: Apply boot patch (one-off)
on:
  push:
    branches: [fast-boot]
    paths: [".github/patches/boot.patch"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fast-boot
      - name: Apply and verify
        run: |
          git apply .github/patches/boot.patch
          printf '%s  site/app.js\n%s  site/app.css\n' e892b2e5d8357e96ddb0561e312661bd670c6c8a96543dafc7246be7130b5b98 8e73b5faf8466985dd030aa5c6003877e69a42f384ca046c9c83de4f447b3f06 | sha256sum -c -
          node --check site/app.js
          git rm -q .github/patches/boot.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app.js site/app.css
          git commit -m "Quicker boot: no forced wait, step aside for a page-shaped skeleton, short intro for returning visitors, readable dim text"
          git push origin HEAD:fast-boot
