name: Build and deploy SubZer0 (static site)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: subzero-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the app script parses
        run: node --check site/app.js && node --check site/sw.js

      - name: Validate the committed snapshot before shipping it
        run: python3 scripts/verify_data_snapshot.py --root public/snapshot

      - name: Assemble the site (shell + snapshot + RSS + JSON API)
        run: python3 scripts/build_site.py --out _site

      - name: Sign the manifest (Ed25519; skipped if the secret is not set)
        env:
          SUBZER0_SIGNING_KEY: ${{ secrets.SUBZER0_SIGNING_KEY }}
        run: python3 scripts/sign_manifest.py --site _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
