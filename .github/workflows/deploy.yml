name: Build and deploy SubZer0 (static site)

on:
  push:
    branches: [main]
  # Fast lane: rebuild the live early-warning layer every ~15 minutes (no commits, nothing touches the snapshot).
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: subzero-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the app script parses
        run: node --check site/app.js && node --check site/sw.js

      - name: Validate the committed snapshot before shipping it
        run: python3 scripts/verify_data_snapshot.py --root public/snapshot

      - name: Assemble the site (shell + snapshot + RSS + JSON API)
        run: python3 scripts/build_site.py --out _site

      - name: Build the live early-warning layer (CVE.org, GHSA, KEV, CERT + security news)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/early_warning.py --site _site --budget-seconds 240 --notify || echo "live layer skipped"

      - name: Sign the manifest (Ed25519; skipped if the secret is not set)
        env:
          SUBZER0_SIGNING_KEY: ${{ secrets.SUBZER0_SIGNING_KEY }}
        run: python3 scripts/sign_manifest.py --site _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # If the 6-hourly snapshot refresh is late (GitHub delays cron by hours) or failed, start it again.
  watchdog:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Re-run the snapshot refresh when it is overdue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AGE_MIN=$(python3 -c "import json,datetime as d;g=json.load(open('public/snapshot/manifest.json'))['generated_at'];print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(g.replace('Z','+00:00'))).total_seconds()//60))")
          echo "snapshot age: ${AGE_MIN} min"
          if [ "$AGE_MIN" -lt 400 ]; then exit 0; fi
          RECENT=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-snapshot.yml --limit 5 --json status,createdAt \
            --jq '[.[] | select(.status != "completed" or ((now - (.createdAt | fromdateiso8601)) < 3000))] | length')
          if [ "$RECENT" != "0" ]; then echo "a refresh is running or just ran; not starting another"; exit 0; fi
          gh workflow run update-snapshot.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "dispatched an overdue snapshot refresh"
