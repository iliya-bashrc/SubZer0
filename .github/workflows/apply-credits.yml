name: apply-credits-patch
on:
  push:
    branches: [credits-rac]
    paths: ['.github/patches/credits.patch']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: credits-rac
      - run: |
          git apply .github/patches/credits.patch
          sed -i 's/CVE briefing by Root Access Club and BugCod3/CVE briefing by Root Access Club/' docs/assets/hero.svg
          cat > /tmp/sums <<'S'
          439008e59122719579025b02716e2dda2228fd2929503e784429e4b7f3760e04  site/app.js
          e4fcf1076c3aea382804ca17dd3a4342386d985fdc78ca79709c2b69004e5bd1  site/app.css
          0228a3fb76d7633c43caa0281297c17156f4516db1bc3781accd0bae64f76225  LICENSE
          cbba978de0bb1c84f4dd712e75d6d5c777eb6fb6ad067e72eedf24945ca89b39  README.md
          0946e2aef0dfda6766e146f68e22fdcfe302883fb830d1e7d20a389047cf608a  docs/assets/hero.svg
          S
          sed -i 's/^ *//' /tmp/sums
          sha256sum -c /tmp/sums
          node --check site/app.js
          git rm -q .github/patches/credits.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A site LICENSE README.md docs
          git commit -m "Credits: made by @RootAccessClub, thanks to @BugCod3"
          git push origin HEAD:credits-rac
