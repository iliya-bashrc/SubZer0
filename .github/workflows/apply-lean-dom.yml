name: apply-dom-patch
on:
  push:
    branches: [lean-dom]
    paths: ['.github/patches/lean-dom.patch']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: lean-dom
      - run: |
          git apply .github/patches/lean-dom.patch
          echo "fd4de7c65d885da6942cf5718db1c5f18bf8103b2a23218e860053764d240114  site/app.js" | sha256sum -c
          node --check site/app.js
          git rm -q .github/patches/lean-dom.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/app.js
          git commit -m "Research: build only the layout on screen (cards on phones, table on wider screens)"
          git push origin HEAD:lean-dom
