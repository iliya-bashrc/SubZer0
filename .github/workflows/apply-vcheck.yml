name: apply-vcheck-patch
on:
  push:
    branches: [version-check]
    paths: ['.github/patches/vcheck.patch']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: version-check
      - run: |
          git apply .github/patches/vcheck.patch
          cat > /tmp/sums <<'S'
          dbea1c7e1e2edf262bce4d75ca25d8652924034c6afeb5850a5573389b34b0ec  site/app.js
          a95ba2d5169934d93bbb78a77e97caed0003b97c1b0f28b91add66d76636c21c  site/app.css
          251ce0fe9ef9aa41178bdbb19564b8e1e190a3cce77749f7df26ac70b5fc7fae  worker/bot.js
          0402c36b1441f0adbb78412a57ea5350fd1fa097abdd6bac537f8192d217d8bc  scripts/build_site.py
          c670cee4f5b8bce07eabe49cd180247951637aec0391e2afcceec0e1b41aa3c2  scripts/versions.py
          4bd14fef18d9504b5d5a4301cb9a175ce349e5cfcf59216bffaa0353faf18a0a  shared/vcheck.js
          17f61746b9169d188cf9354bf452ea015d924302c16620114c04e1eb4a72ae88  tests/test_versions.py
          df9add3d67c7a8ac008005684468096108df9b3bf163645d1c87a99ecb88bb0f  tests/bot_harness.mjs
          S
          sed -i 's/^ *//' /tmp/sums
          sha256sum -c /tmp/sums
          node --check site/app.js
          node --check worker/bot.js
          git rm -q .github/patches/vcheck.patch
          git config user.name "iliya-bashrc"
          git config user.email "iliya-bashrc@users.noreply.github.com"
          git add -A site worker scripts shared tests
          git commit -m "Am I affected? Version check on the site, in the terminal and in the bot (/check)"
          git push origin HEAD:version-check
