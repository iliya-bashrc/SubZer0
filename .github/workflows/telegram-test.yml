name: Telegram test message

# Manual check that TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID work: Actions -> Telegram test message -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send a test message to the alerts channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          token, chat = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip(), os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              sys.exit("TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing")
          text = ("\u2705 <b>SubZer0 Sentinel is connected</b>\n"
                  "Live CVE & zero-day alerts will be posted here automatically.\n"
                  "https://iliya-bashrc.github.io/SubZer0/")
          body = urllib.parse.urlencode({"chat_id": chat, "text": text, "parse_mode": "HTML",
                                         "disable_web_page_preview": "true"}).encode()
          try:
              with urllib.request.urlopen(urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/sendMessage", data=body, method="POST"), timeout=20) as r:
                  print("Telegram:", json.load(r).get("ok"))
          except urllib.error.HTTPError as exc:
              sys.exit("Telegram error: " + str(json.load(exc).get("description")))
          PY
