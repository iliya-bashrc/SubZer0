<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub Zero — Zero-Day Radar // Root Access Club</title>
<meta name="description" content="Live zero-day & CVE radar. Cold, precise, real-time. Root Access Club.">
<style>
:root{
  --bg:#030712; --navy:#0a1628; --ice:#00f0ff; --frost:#e0f7ff;
  --crit1:#ff3b3b; --crit2:#ff7a00; --high:#ff5e00; --med:#f59e0b; --low:#22d3ee;
  --glass:rgba(10,22,40,.55); --line:rgba(0,240,255,.14);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:Inter,-apple-system,'Segoe UI',sans-serif;
  --head:'Inter Tight',Inter,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--frost);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
::selection{background:rgba(0,240,255,.3)}
/* ---------- ambient background ---------- */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none}
#bgfx canvas{position:absolute;inset:0;width:100%;height:100%}
.aurora{position:fixed;top:-30vh;left:-10vw;width:120vw;height:80vh;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 30% 40%,rgba(0,240,255,.07),transparent 60%),
             radial-gradient(ellipse at 70% 60%,rgba(10,22,40,.6),transparent 70%);
  animation:aurora 18s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translateY(4vh) scale(1.06)}}
/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.2rem;transition:opacity .8s ease,visibility .8s}
#loader.done{opacity:0;visibility:hidden}
#temp{font-family:var(--mono);font-size:clamp(3rem,9vw,5.5rem);font-weight:700;color:var(--ice);
  text-shadow:0 0 40px rgba(0,240,255,.55)}
#loadlogo{font-family:var(--head);font-weight:800;font-size:clamp(1.6rem,5vw,2.4rem);letter-spacing:.35em;
  color:var(--frost);opacity:0;animation:frostIn 1.6s .8s forwards}
@keyframes frostIn{0%{opacity:0;filter:blur(14px);letter-spacing:.8em}100%{opacity:1;filter:blur(0);letter-spacing:.35em}}
#loadtag{font-family:var(--mono);font-size:.75rem;letter-spacing:.25em;color:rgba(224,247,255,.5);opacity:0;animation:frostIn 1.4s 1.5s forwards}
.frost-ring{position:absolute;border:1px solid rgba(0,240,255,.12);border-radius:50%;animation:spread 3s ease-out forwards}
@keyframes spread{from{transform:scale(.1);opacity:.9}to{transform:scale(3.2);opacity:0}}
.fog{position:absolute;bottom:0;left:0;right:0;height:40vh;pointer-events:none;
  background:linear-gradient(to top,rgba(224,247,255,.05),transparent);animation:breath 4s ease-in-out infinite}
@keyframes breath{50%{opacity:.4;transform:translateY(-3vh)}}
/* ---------- shell ---------- */
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 clamp(1rem,3vw,2rem)}
header{padding:clamp(1.4rem,4vw,2.6rem) 0 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.8rem}
.logo-mark{width:44px;height:44px;flex:0 0 auto}
h1{font-family:var(--head);font-size:clamp(1.25rem,3.5vw,1.7rem);font-weight:800;letter-spacing:.06em;
  background:linear-gradient(90deg,var(--frost),var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:var(--mono);font-size:.68rem;letter-spacing:.28em;color:rgba(224,247,255,.45);margin-top:.15rem}
.live{margin-left:auto;display:flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.72rem;
  color:var(--ice);border:1px solid var(--line);padding:.45rem .9rem;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ice);box-shadow:0 0 10px var(--ice);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin:1.2rem 0}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;backdrop-filter:blur(14px)}
.stat .n{font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--frost)}
.stat .l{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(224,247,255,.45);margin-top:.2rem}
.stat.hot .n{color:var(--crit1);text-shadow:0 0 18px rgba(255,59,59,.5)}
/* filters */
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin:.4rem 0 1.4rem;align-items:center}
.fbtn{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;padding:.5rem .95rem;border-radius:999px;
  border:1px solid var(--line);background:var(--glass);color:rgba(224,247,255,.75);cursor:pointer;
  transition:.25s;backdrop-filter:blur(10px)}
.fbtn:hover{transform:translateY(-1px);border-color:rgba(0,240,255,.45);color:var(--ice)}
.fbtn.on{background:rgba(0,240,255,.12);color:var(--ice);border-color:var(--ice);box-shadow:0 0 14px rgba(0,240,255,.18)}
.search{flex:1 1 220px;min-width:180px;position:relative}
.search input{width:100%;padding:.55rem .9rem .55rem 2.2rem;border-radius:999px;border:1px solid var(--line);
  background:var(--glass);color:var(--frost);font-family:var(--mono);font-size:.78rem;outline:none;backdrop-filter:blur(10px)}
.search input:focus{border-color:var(--ice);box-shadow:0 0 16px rgba(0,240,255,.15)}
.search svg{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);opacity:.5}
/* cards */
#feed{display:grid;gap:1rem;padding-bottom:2rem}
.card{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:18px;
  padding:1.15rem 1.25rem;backdrop-filter:blur(16px);overflow:hidden;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.4),box-shadow .35s,border-color .35s;
  animation:slidein .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slidein{from{opacity:0;transform:translateY(-22px) scale(.985)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px) scale(1.006);border-color:rgba(0,240,255,.4);
  box-shadow:0 14px 44px -14px rgba(0,240,255,.25)}
.card .topline{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.cve{font-family:var(--mono);font-weight:700;font-size:.86rem;color:var(--ice);letter-spacing:.03em}
.cve a{color:inherit;text-decoration:none}.cve a:hover{text-shadow:0 0 12px var(--ice)}
.badge{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.12em;padding:.28rem .6rem;border-radius:6px;text-transform:uppercase}
.badge.critical{background:linear-gradient(120deg,var(--crit1),var(--crit2));color:#fff;box-shadow:0 0 16px rgba(255,59,59,.45)}
.badge.high{background:rgba(255,94,0,.16);color:var(--high);border:1px solid rgba(255,94,0,.5)}
.badge.medium{background:rgba(245,158,11,.14);color:var(--med);border:1px solid rgba(245,158,11,.45)}
.badge.low{background:rgba(34,211,238,.12);color:var(--low);border:1px solid rgba(34,211,238,.45)}
.score{margin-left:auto;font-family:var(--mono);font-size:1.05rem;font-weight:700}
.score.critical{color:var(--crit1)}.score.high{color:var(--high)}.score.medium{color:var(--med)}.score.low{color:var(--low)}
.card h3{font-family:var(--head);font-size:1.02rem;font-weight:700;margin:.6rem 0 .35rem;color:var(--frost);line-height:1.4}
.desc{font-size:.83rem;color:rgba(224,247,255,.66);line-height:1.55;max-width:70ch}
.meta{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;align-items:center}
.chip{font-family:var(--mono);font-size:.64rem;padding:.22rem .6rem;border-radius:999px;
  border:1px solid rgba(224,247,255,.14);color:rgba(224,247,255,.55)}
.chip.src{border-color:rgba(0,240,255,.3);color:rgba(0,240,255,.8)}
.chip.exploit{border-color:rgba(255,59,59,.5);color:var(--crit1)}
.card.new-flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 rgba(0,240,255,0)}30%{box-shadow:0 0 40px rgba(0,240,255,.5);border-color:var(--ice)}}
/* heat effect for critical/high */
.card.hot{border-color:rgba(255,59,59,.4)}
.card.hot::before{content:'';position:absolute;inset:-40%;pointer-events:none;
  background:radial-gradient(ellipse at 85% 110%,rgba(255,59,59,.16),transparent 55%),
             radial-gradient(ellipse at 10% -10%,rgba(255,122,0,.10),transparent 50%);
  animation:heatwave 5s ease-in-out infinite}
@keyframes heatwave{0%,100%{transform:translateY(0) scale(1);opacity:.8}50%{transform:translateY(-10px) scale(1.05);opacity:1}}
.card.hot:hover{box-shadow:0 16px 50px -12px rgba(255,59,59,.4);border-color:rgba(255,59,59,.6)}
.card.hot:hover{animation:rise .6s ease}
@keyframes rise{30%{transform:translateY(-6px)}}
.ember{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--crit2);
  box-shadow:0 0 8px var(--crit1);pointer-events:none;opacity:0}
.card.hot .ember{animation:emberUp 3.4s linear infinite}
@keyframes emberUp{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-120px)}}
/* skeleton */
.sk{height:110px;border-radius:18px;border:1px solid var(--line);background:
  linear-gradient(100deg,var(--glass) 40%,rgba(0,240,255,.06) 50%,var(--glass) 60%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
/* footer */
footer{border-top:1px solid var(--line);margin-top:2rem;padding:2rem 0 2.6rem;text-align:center}
footer .fbrand{font-family:var(--head);font-weight:800;letter-spacing:.12em;color:var(--frost)}
footer .fsub{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;color:rgba(224,247,255,.5);margin:.5rem 0}
footer a{color:var(--ice);text-decoration:none;border-bottom:1px dotted rgba(0,240,255,.4)}
footer a:hover{text-shadow:0 0 10px var(--ice)}
footer .copy{font-size:.7rem;color:rgba(224,247,255,.35);margin-top:.6rem}
#err{font-family:var(--mono);font-size:.72rem;color:var(--med);text-align:center;padding:1rem;display:none}
@media(max-width:640px){.live{margin-left:0}.score{margin-left:auto}}
</style>
</head>
<body>
<div id="bgfx"><canvas id="particles"></canvas></div>
<div class="aurora"></div>

<div id="loader">
  <div id="temp">0°C</div>
  <div id="loadlogo">SUB ZERO</div>
  <div id="loadtag">ZERO-DAY RADAR // ROOT ACCESS CLUB</div>
  <div class="fog"></div>
</div>

<div class="wrap">
  <header>
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 48 48" fill="none">
        <path d="M24 4 42 14v20L24 44 6 34V14L24 4z" stroke="#00f0ff" stroke-width="1.6" opacity=".85"/>
        <path d="M24 12 34 18v12l-10 6-10-6V18l10-6z" stroke="#e0f7ff" stroke-width="1.2" opacity=".5"/>
        <circle cx="24" cy="24" r="4" fill="#00f0ff"/>
      </svg>
      <div>
        <h1>SUB ZERO — ZERO-DAY RADAR</h1>
        <div class="sub">ROOT ACCESS CLUB</div>
      </div>
    </div>
    <div class="live"><span class="dot"></span><span id="liveTxt">LIVE · SYNCING…</span></div>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="sTotal">—</div><div class="l">Tracked CVEs</div></div>
    <div class="stat hot"><div class="n" id="sCrit">—</div><div class="l">Critical</div></div>
    <div class="stat"><div class="n" id="sHigh">—</div><div class="l">High</div></div>
    <div class="stat"><div class="n" id="sExp">—</div><div class="l">With References</div></div>
  </div>

  <div class="filters" id="sevFilters">
    <button class="fbtn on" data-sev="all">ALL</button>
    <button class="fbtn" data-sev="critical">CRITICAL</button>
    <button class="fbtn" data-sev="high">HIGH</button>
    <button class="fbtn" data-sev="medium">MEDIUM</button>
    <button class="fbtn" data-sev="low">LOW</button>
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#e0f7ff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="q" type="text" placeholder="search cve, vendor, keyword…">
    </div>
  </div>

  <div id="feed"></div>
  <div id="err"></div>

  <footer>
    <div class="fbrand">SUB ZERO — ZERO-DAY RADAR</div>
    <div class="fsub">ROOT ACCESS CLUB</div>
    <div class="fsub">Telegram: <a href="https://t.me/RootAccessClub" target="_blank" rel="noopener">@RootAccessClub</a></div>
    <div class="copy">© Root Access Club. All rights reserved. · Data: NVD (NIST) / CIRCL</div>
  </footer>
</div>

<script>
/* ============ data layer (swap for real backend later) ============ */
const API = {
  nvd: 'https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=40&pubStartDate=',
  circl: 'https://cve.circl.lu/api/last/'
};
const SEV_ORDER = {critical:0, high:1, medium:2, low:3, unknown:4};
function sevOf(score){ if(score==null) return 'unknown';
  if(score>=9) return 'critical'; if(score>=7) return 'high'; if(score>=4) return 'medium'; return 'low'; }

function parseNVD(json){
  return (json.vulnerabilities||[]).map(v=>{ const c=v.cve;
    let score=null, vec='';
    const m = c.metrics?.cvssMetricV31?.[0] || c.metrics?.cvssMetricV30?.[0] || c.metrics?.cvssMetricV2?.[0];
    if(m){ score=m.cvssData.baseScore; vec=m.cvssData.vectorString||''; }
    const desc = (c.descriptions||[]).find(d=>d.lang==='en')?.value||'No description.';
    const vendors = new Set();
    (c.configurations||[]).forEach(n=>n.nodes.forEach(nd=>nd.cpeMatch.forEach(cm=>{
      const parts=(cm.criteria||'').split(':'); if(parts[3]) vendors.add(parts[3]);
    })));
    const refs = (c.references||[]).map(r=>r.url).filter(Boolean);
    return { id:c.id, title:desc.split('. ')[0].slice(0,110), desc, score, sev:sevOf(score),
      published:c.published, vendors:[...vendors].slice(0,6), refs:refs.slice(0,5),
      sources:['NVD','CVE.org'] };
  });
}
let seen = new Set(), allCVEs = [], state = {sev:'all', q:''};

async function fetchCVEs(){
  const end = new Date();
  const start = new Date(end.getTime() - 7*864e5);
  const fmt = d => d.toISOString().slice(0,19) + '.000Z';
  const url = API.nvd + fmt(start) + '&pubEndDate=' + fmt(end);
  const r = await fetch(url);
  if(!r.ok) throw new Error('NVD '+r.status);
  return parseNVD(await r.json());
}

/* ============ rendering ============ */
const feed = document.getElementById('feed');
const HOT_EMBERS = c => {
  if(c.sev!=='critical' && c.sev!=='high') return '';
  let s=''; for(let i=0;i<4;i++){ const l=12+Math.random()*76, d=(Math.random()*3).toFixed(2), w=(1.6+Math.random()*2).toFixed(1);
    s+=`<span class="ember" style="left:${l}%;bottom:8px;animation-delay:${d}s;width:${w}px;height:${w}px"></span>`; }
  return s;
};
function cardHTML(c, isNew){
  const d = new Date(c.published);
  return `<article class="card ${c.sev==='critical'||c.sev==='high'?'hot':''} ${isNew?'new-flash':''}">
    ${HOT_EMBERS(c)}
    <div class="topline">
      <span class="cve"><a href="https://nvd.nist.gov/vuln/detail/${c.id}" target="_blank" rel="noopener">${c.id}</a></span>
      <span class="badge ${c.sev}">${c.sev}</span>
      ${c.exploit?'<span class="chip exploit">PUBLIC EXPLOIT</span>':''}
      <span class="score ${c.sev}">${c.score!=null?c.score:'N/A'}</span>
    </div>
    <h3>${c.title}</h3>
    <p class="desc">${c.desc.slice(0,240)}${c.desc.length>240?'…':''}</p>
    <div class="meta">
      <span class="chip">📅 ${d.toISOString().slice(0,10)}</span>
      ${c.vendors.slice(0,4).map(v=>`<span class="chip">${v}</span>`).join('')}
      ${c.sources.map(s=>`<span class="chip src">${s}</span>`).join('')}
      ${c.refs.length?`<span class="chip">${c.refs.length} refs</span>`:''}
    </div>
  </article>`;
}
function sortFeed(list){
  return list.slice().sort((a,b)=>{
    if(a.sev!==b.sev) return SEV_ORDER[a.sev]-SEV_ORDER[b.sev];
    return new Date(b.published)-new Date(a.published);
  });
}
function render(){
  let list = allCVEs.filter(c=> (state.sev==='all'||c.sev===state.sev) &&
    (!state.q || (c.id+' '+c.title+' '+c.desc+' '+c.vendors.join(' ')).toLowerCase().includes(state.q)));
  list = sortFeed(list);
  feed.innerHTML = list.length ? list.map(c=>cardHTML(c,false)).join('')
    : '<div id="err" style="display:block">no results match your filters.</div>';
  const s = sev => allCVEs.filter(c=>c.sev===sev).length;
  document.getElementById('sTotal').textContent = allCVEs.length;
  document.getElementById('sCrit').textContent = s('critical');
  document.getElementById('sHigh').textContent = s('high');
  document.getElementById('sExp').textContent = allCVEs.filter(c=>c.refs.length).length;
}
function mergeCVEs(fresh){
  const newOnes = fresh.filter(c=>!seen.has(c.id));
  if(!newOnes.length) return false;
  newOnes.forEach(c=>seen.add(c.id));
  const criticalDrop = newOnes.some(c=>c.sev==='critical');
  allCVEs = [...newOnes, ...allCVEs];
  if(document.readyState && !document.hidden){
    // slide-in new cards on top, then rerender whole list hot-first
    const frag = sortFeed(newOnes).map(c=>cardHTML(c,true)).join('');
    feed.insertAdjacentHTML('afterbegin', frag);
    setTimeout(render, 1400);
  } else render();
  return criticalDrop;
}
/* skeleton */
feed.innerHTML = Array(5).fill('<div class="sk"></div>').join('');

/* ============ live loop ============ */
async function poll(first){
  try{
    const fresh = await fetchCVEs();
    const crit = mergeCVEs(fresh);
    document.getElementById('liveTxt').textContent = 'LIVE · '+new Date().toLocaleTimeString();
    document.getElementById('err').style.display='none';
    if(crit && !first) document.title = '🔥 CRITICAL CVE — SUB ZERO';
  }catch(e){
    const err=document.getElementById('err');
    err.style.display='block'; err.textContent='⚠ feed temporarily unavailable — retrying…';
    setTimeout(()=>{ if(!allCVEs.length) err.textContent='⚠ upstream feed unreachable. check connection.'; },3000);
  }
}
poll(true);
setInterval(()=>poll(false), 40000);

/* ============ filters ============ */
document.getElementById('sevFilters').addEventListener('click', e=>{
  const b=e.target.closest('.fbtn'); if(!b) return;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.sev=b.dataset.sev; render();
});
document.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value.toLowerCase(); render(); });

/* ============ loader sequence ============ */
(function loader(){
  const box=document.getElementById('loader'), temp=document.getElementById('temp');
  let t=0; const target=-47, dur=2600, start=performance.now();
  for(let i=0;i<5;i++){ const r=document.createElement('div'); r.className='frost-ring';
    r.style.cssText+=`width:${120+i*70}px;height:${120+i*70}px;animation-delay:${i*.45}s`;
    box.appendChild(r); }
  function tick(now){ const p=Math.min(1,(now-start)/dur);
    temp.textContent=Math.round(target*p)+'°C';
    if(p<1) requestAnimationFrame(tick); else setTimeout(()=>box.classList.add('done'),300); }
  requestAnimationFrame(tick);
  setTimeout(()=>box.classList.add('done'), 3400); // safety
})();

/* ============ ambient frost particles ============ */
(function fx(){
  const cv=document.getElementById('particles'), ctx=cv.getContext('2d');
  let W,H,P=[];
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  addEventListener('resize',resize); resize();
  const N = Math.min(90, Math.floor(W*H/16000));
  for(let i=0;i<N;i++) P.push({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.8,
    s:.15+Math.random()*.5,o:.08+Math.random()*.3,drift:Math.random()*2-1});
  (function loop(){
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.y-=p.s; p.x+=p.drift*.2;
      if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7);
      ctx.fillStyle=`rgba(0,240,255,${p.o})`; ctx.fill(); });
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
